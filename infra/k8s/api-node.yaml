apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-node
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-node }
  template:
    metadata:
      labels: { app: api-node }
    spec:
      containers:
        - name: api-node
          image: ghcr.io/samog76/mobile-pos-api-node:latest
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: api-node
spec:
  selector: { app: api-node }
  ports:
    - port: 80
      targetPort: 4000
