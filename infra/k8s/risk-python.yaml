apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-python
spec:
  replicas: 1
  selector:
    matchLabels: { app: risk-python }
  template:
    metadata:
      labels: { app: risk-python }
    spec:
      containers:
        - name: risk-python
          image: ghcr.io/samog76/mobile-pos-risk-python:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: risk-python
spec:
  selector: { app: risk-python }
  ports:
    - port: 80
      targetPort: 5000
