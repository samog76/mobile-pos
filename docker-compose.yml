services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mobilepos
    ports: ["5432:5432"]
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9000:9000"]
  localstack:
    image: localstack/localstack:3.6
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
  api-node:
    image: node:20
    working_dir: /app
    volumes:
      - ../../services/api-node:/app
    command: sh -c "npm install && npm run dev"
    ports: ["4000:4000"]
    depends_on: [postgres, mongodb, kafka, localstack]
  risk-python:
    image: python:3.12
    working_dir: /app
    volumes:
      - ../../services/risk-python:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 5000"
    ports: ["5000:5000"]
  ledger-java:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - ../../services/ledger-java:/app
    command: sh -c "mvn spring-boot:run"
    ports: ["8080:8080"]
    depends_on: [postgres]
