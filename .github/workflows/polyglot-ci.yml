name: polyglot-ci

on:
  push:
  pull_request:

jobs:
  web-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run build

  web-next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run build

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/risk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pytest -q

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: mvn -B test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.0' }
      - run: flutter pub get
      - run: flutter analyze

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew tasks || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd services/api-node && npm install && npm audit --audit-level=high || true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pip-audit && pip-audit -r services/risk-python/requirements.txt || true
